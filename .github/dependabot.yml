version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/web/incidentbrain-web"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # Actions used only by the deploy workflow (e.g. gitleaks-action) are never
  # exercised on a PR — only on a push to main. Watch the first deploy after
  # one of these updates merges (see docs/DEPLOYMENT.md).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
