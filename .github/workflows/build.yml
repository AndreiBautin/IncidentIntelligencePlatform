name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, test, secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: |
          dotnet restore src/IncidentBrain.API/IncidentBrain.API.csproj
          dotnet restore tests/IncidentBrain.Tests/IncidentBrain.Tests.csproj

      - name: Build API
        run: dotnet build src/IncidentBrain.API/IncidentBrain.API.csproj -c Release --no-restore

      - name: Test with coverage
        run: dotnet test tests/IncidentBrain.Tests/IncidentBrain.Tests.csproj -c Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/incidentbrain-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix web/incidentbrain-web

      - name: Build frontend
        run: npm run build --prefix web/incidentbrain-web
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_READ_ONLY: "true"

      - name: Secret scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --no-banner --exit-code 1
