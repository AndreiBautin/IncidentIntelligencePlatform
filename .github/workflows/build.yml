name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build API and Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore API
        run: dotnet restore src/IncidentBrain.API/IncidentBrain.API.csproj

      - name: Build API
        run: dotnet build src/IncidentBrain.API/IncidentBrain.API.csproj -c Release --no-restore

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/incidentbrain-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix web/incidentbrain-web

      - name: Build frontend
        run: npm run build --prefix web/incidentbrain-web
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_READ_ONLY: "false"
